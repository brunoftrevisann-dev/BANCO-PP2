project_id = "bjpgdcgloinsjogpwwgm"

# Pública a propósito: los otros bancos de la cátedra no son usuarios de este
# proyecto de Supabase, así que no pueden mandar un JWT de Supabase Auth válido.
# La autenticación real pasa por la firma ES256 del propio QR, verificada del
# lado del backend de Express al que esta función hace de proxy.
[functions.qr-lectura]
verify_jwt = false

# También pública ante Supabase (verify_jwt=false): la protección real es un secret
# interno propio (QR_FIRMAR_INTERNAL_SECRET) que solo conoce nuestro backend de Express,
# chequeado a mano dentro de la función — ver supabase/functions/qr-firmar/index.ts.
[functions.qr-firmar]
verify_jwt = false
