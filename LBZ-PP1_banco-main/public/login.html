<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tuo — Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="tuo-i18n.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #F9F9F9;
            --text: #1A1A1B;
            --accent: #0052FF;
            --muted: #6B6B6B;
            --border: #E8E8E8;
            --error-bg: #FEF2F2;
            --error-text: #B91C1C;
            --error-border: #FECACA;
            --success-bg: #F0FDF4;
            --success-text: #15803D;
            --success-border: #BBF7D0;
        }

        [data-theme="dark"] {
            --bg: #111113;
            --text: #F0F0F0;
            --muted: #8E8E8E;
            --border: #2C2C2E;
            --error-bg: #2D0A0A;
            --error-text: #FF6B6B;
            --error-border: #5C1A1A;
            --success-bg: #0A2D18;
            --success-text: #4ADE80;
            --success-border: #166534;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
        }

        .btn-theme {
            position: fixed;
            top: 20px; right: 24px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.15s, border-color 0.15s, background 0.3s, border-color 0.3s;
            z-index: 50;
        }
        .btn-theme:hover { color: var(--text); border-color: #aaa; }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--text);
            text-decoration: none;
            margin-bottom: 52px;
            display: block;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 380px;
        }

        .card-heading {
            margin-bottom: 40px;
        }

        .card-heading h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        .card-heading p {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 400;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 500;
            margin-bottom: 24px;
            display: none;
            line-height: 1.4;
        }

        .message.error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
            display: block;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            display: block;
        }

        .form-group { margin-bottom: 28px; }

        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1.5px solid var(--border);
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            border-radius: 0;
        }
        input:focus { border-bottom-color: var(--accent); }
        input::placeholder { color: #C8C8C8; font-weight: 300; }
        [data-theme="dark"] input::placeholder { color: #444; }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #F9F9F9 inset;
            -webkit-text-fill-color: #1A1A1B;
            caret-color: #1A1A1B;
            transition: background-color 5000s ease-in-out 0s;
            border-bottom-color: #0052FF !important;
            animation: autofillPulse 0.6s ease;
        }
        [data-theme="dark"] input:-webkit-autofill,
        [data-theme="dark"] input:-webkit-autofill:hover,
        [data-theme="dark"] input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #111113 inset;
            -webkit-text-fill-color: #F0F0F0;
            caret-color: #F0F0F0;
            border-bottom-color: #0052FF !important;
        }
        @keyframes autofillPulse {
            0%   { border-bottom-color: var(--border); }
            40%  { border-bottom-color: #0052FF; }
            100% { border-bottom-color: #0052FF; }
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 36px;
            transition: opacity 0.15s, transform 0.15s;
            letter-spacing: -0.01em;
        }
        .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 28px 0;
            font-size: 0.78rem;
            color: var(--muted);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .btn-biometric {
            width: 100%;
            padding: 13px;
            background: none;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: border-color 0.15s, color 0.15s;
        }
        .btn-biometric:hover { border-color: var(--accent); color: var(--accent); }

        .link-forgot {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.83rem;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.15s;
        }
        .link-forgot:hover { color: var(--accent); }

        .footer-signup {
            margin-top: 56px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .footer-signup a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .footer-signup a:hover { text-decoration: underline; }

        @keyframes pageIn  { from { opacity:0; transform:translateY(12px) scale(0.99); } to { opacity:1; transform:translateY(0) scale(1); } }
        @keyframes pageOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-8px) scale(0.99); } }
        body { animation: pageIn 0.35s cubic-bezier(0.16,1,0.3,1) both; }
        body.leaving { animation: pageOut 0.22s ease forwards; pointer-events:none; }
    </style>
</head>
<body>

    <button class="btn-theme" id="btnTheme" onclick="toggleTheme()" title="Cambiar tema"></button>

    <a href="/" class="logo">tuo</a>

    <div class="card">
        <div class="card-heading">
            <h1 data-i18n="login.title">Bienvenido a tuo</h1>
            <p data-i18n="login.subtitle">Ingresá a tu cuenta para continuar</p>
        </div>

        <div class="message" id="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email" data-i18n="login.email">Email</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" data-i18n="login.password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary" id="btnLogin" data-i18n="login.enter">Entrar</button>
        </form>

        <div class="divider">o</div>

        <button class="btn-biometric" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0052FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3H7a2 2 0 0 0-2 2v2"/>
                <path d="M15 3h2a2 2 0 0 1 2 2v2"/>
                <path d="M9 21H7a2 2 0 0 1-2-2v-2"/>
                <path d="M15 21h2a2 2 0 0 0 2-2v-2"/>
                <path d="M9 9.5v1"/>
                <path d="M15 9.5v1"/>
                <path d="M12 9v4"/>
                <path d="M9.5 15c.8.8 1.4 1 2.5 1s1.7-.2 2.5-1"/>
            </svg>
            <span data-i18n="login.biometric">Acceder con Face ID</span>
        </button>

        <a href="#" class="link-forgot" data-i18n="login.forgot">¿Olvidaste tu acceso?</a>
    </div>

    <div class="footer-signup">
        <span data-i18n="login.no_account">¿Nuevo en tuo?</span> <a href="registro.html" data-i18n="login.register">Crea tu cuenta</a>
    </div>

    <script>
        // ── DARK MODE ────────────────────────────────────────────────────
        const MOON = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
        const SUN  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;

        function applyTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            document.getElementById('btnTheme').innerHTML = t === 'dark' ? SUN : MOON;
        }
        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('tuo-theme', next);
            applyTheme(next);
        }
        function resolverTema() {
            const t = localStorage.getItem('tuo-theme');
            if (t === 'light' || t === 'dark') return t;
            const s = JSON.parse(localStorage.getItem('tuo_dark_hours') || 'null');
            if (s?.enabled) {
                const n = new Date(), c = n.getHours()*60+n.getMinutes();
                const [dh,dm]=(s.desde||'20:00').split(':').map(Number);
                const [hh,hm]=(s.hasta||'08:00').split(':').map(Number);
                const f=dh*60+dm, e=hh*60+hm;
                return (f>e ? c>=f||c<e : c>=f&&c<e) ? 'dark' : 'light';
            }
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        applyTheme(resolverTema());

        // ── LOGIN ────────────────────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btnLogin');

            if (!email || !password) {
                showMessage('Por favor completá todos los campos', 'error');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = 'Verificando...';

            try {
                const response = await fetch('/api/personas/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    showMessage(result.error || 'Email o contraseña incorrectos', 'error');
                    btnLogin.disabled = false;
                    btnLogin.textContent = window.t ? window.t('login.enter') : 'Entrar';
                    return;
                }

                localStorage.setItem('usuarioLogueado', JSON.stringify(result));
                showMessage('¡Acceso exitoso! Redirigiendo...', 'success');

                // Registrar acceso con geolocalización y dispositivo
                const actKey   = 'tuo_activity_' + result.cbu;
                const actLog   = JSON.parse(localStorage.getItem(actKey) || '[]');
                const entrada  = { ts: new Date().toISOString(), dispositivo: detectarDispositivo() };
                try {
                    const geo = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(3000) });
                    if (geo.ok) {
                        const g = await geo.json();
                        entrada.ciudad = g.city || null;
                        entrada.pais   = g.country_name || null;
                        entrada.ip     = g.ip || null;
                        entrada.lat    = g.latitude  || null;
                        entrada.lon    = g.longitude || null;
                    }
                } catch { /* sin geo, igual guardamos */ }
                actLog.unshift(entrada);
                if (actLog.length > 10) actLog.pop();
                localStorage.setItem(actKey, JSON.stringify(actLog));

                setTimeout(() => navTo('dashboard.html'), 670);

            } catch (error) {
                showMessage('Error de conexión: ' + error.message, 'error');
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar';
            }
        });

        function detectarDispositivo() {
            const ua = navigator.userAgent;
            const os = /Windows/.test(ua) ? 'Windows'
                     : /Mac OS X/.test(ua) ? 'macOS'
                     : /Android/.test(ua) ? 'Android'
                     : /iPhone|iPad/.test(ua) ? 'iOS'
                     : /Linux/.test(ua) ? 'Linux' : 'Desconocido';
            const browser = /Edg\//.test(ua) ? 'Edge'
                          : /OPR\/|Opera/.test(ua) ? 'Opera'
                          : /Chrome\//.test(ua) ? 'Chrome'
                          : /Firefox\//.test(ua) ? 'Firefox'
                          : /Safari\//.test(ua) ? 'Safari' : 'Navegador';
            return `${browser} · ${os}`;
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }

        function navTo(url) {
            document.body.classList.add('leaving');
            setTimeout(() => { window.location.href = url; }, 230);
        }
        window.addEventListener('pageshow', e => {
            if (e.persisted || performance.getEntriesByType('navigation')[0]?.type === 'back_forward') {
                document.body.classList.remove('leaving');
                document.body.style.animation = 'none';
                void document.body.offsetHeight;
                document.body.style.animation = '';
            }
        });
        document.addEventListener('click', e => {
            const a = e.target.closest('a[href]');
            if (!a) return;
            const href = a.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto')) return;
            e.preventDefault();
            navTo(href);
        });
    </script>
</body>
</html>
