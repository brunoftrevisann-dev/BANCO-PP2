<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tuo — Estadísticas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #F9F9F9;
            --text: #1A1A1B;
            --accent: #0052FF;
            --muted: #6B6B6B;
            --border: #E5E5E5;
            --white: #FFFFFF;
            --green: #16a34a;
            --red: #DC2626;
        }
        [data-theme="dark"] {
            --bg: #111113;
            --text: #F0F0F0;
            --muted: #8E8E8E;
            --border: #2C2C2E;
            --white: #1C1C1E;
            --green: #4ade80;
            --red: #f87171;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
        }

        /* ── HEADER ── */
        .header {
            background: var(--white); border-bottom: 1px solid var(--border);
            padding: 0 40px; height: 62px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
            transition: background 0.3s, border-color 0.3s;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .btn-back {
            display: flex; align-items: center; gap: 6px;
            background: none; border: 1px solid var(--border); border-radius: 8px;
            padding: 6px 12px; cursor: pointer; color: var(--muted);
            font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 500;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .btn-back:hover { color: var(--text); border-color: #aaa; background: var(--bg); }
        .header-logo { font-size: 1.15rem; font-weight: 800; color: var(--accent); letter-spacing: -0.03em; }
        .page-title { font-size: 1rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
        .btn-theme {
            background: none; border: 1px solid var(--border); border-radius: 8px;
            width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--muted); transition: color 0.15s, border-color 0.15s; flex-shrink: 0;
        }
        .btn-theme:hover { color: var(--text); border-color: #aaa; }

        /* ── LAYOUT ── */
        .main {
            max-width: 720px; margin: 0 auto;
            padding: 32px 24px 64px;
            display: flex; flex-direction: column; gap: 16px;
        }

        /* ── HERO SALDO ── */
        .hero-card {
            background: var(--accent);
            border-radius: 20px; padding: 28px 32px;
            color: white; position: relative; overflow: hidden;
        }
        .hero-card::before {
            content: ''; position: absolute; top: -60px; right: -60px;
            width: 220px; height: 220px; background: rgba(255,255,255,0.07);
            border-radius: 50%; pointer-events: none;
        }
        .hero-label {
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.1em; color: rgba(255,255,255,0.65); margin-bottom: 8px;
        }
        .hero-val {
            font-size: 2.6rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
        }
        .hero-name {
            font-size: 0.84rem; color: rgba(255,255,255,0.55); margin-top: 10px; font-weight: 400;
        }

        /* ── KPI CARDS ── */
        .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

        .kpi-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: 16px; padding: 18px 20px;
            display: flex; align-items: center; gap: 14px;
            transition: background 0.3s, border-color 0.3s;
        }

        .kpi-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .kpi-icon.green { background: rgba(22,163,74,0.1); }
        .kpi-icon.red   { background: rgba(220,38,38,0.1); }
        .kpi-icon.blue  { background: rgba(0,82,255,0.1);  }

        .kpi-label {
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--muted); margin-bottom: 4px;
        }
        .kpi-val { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
        .kpi-val.green { color: var(--green); }
        .kpi-val.red   { color: var(--red); }
        .kpi-val.blue  { color: var(--accent); }

        /* ── CHART CARD ── */
        .chart-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: 16px; padding: 22px 24px;
            transition: background 0.3s, border-color 0.3s;
        }
        .chart-card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px;
        }
        .chart-card-title {
            font-size: 0.88rem; font-weight: 700; color: var(--text); letter-spacing: -0.01em;
        }
        .chart-legend {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.75rem; color: var(--muted); font-weight: 500;
        }
        .legend-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; flex-shrink: 0;
        }
        .legend-sep { color: var(--border); margin: 0 2px; }

        .chart-wrap { position: relative; height: 220px; }

        /* ── MOTIVOS ── */
        .motivos-layout {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center;
        }
        .chart-wrap-donut { position: relative; height: 180px; }

        .motivo-list { display: flex; flex-direction: column; gap: 10px; }
        .motivo-item {
            display: flex; align-items: center; gap: 10px;
        }
        .motivo-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
        .motivo-name {
            flex: 1; font-size: 0.83rem; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .motivo-amt { font-size: 0.83rem; font-weight: 600; color: var(--muted); flex-shrink: 0; }

        /* ── EMPTY ── */
        .chart-empty {
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px;
            color: var(--muted); text-align: center;
        }
        .chart-empty p { font-size: 0.8rem; max-width: 200px; line-height: 1.5; }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .header { padding: 0 16px; }
            .main { padding: 20px 16px 60px; gap: 12px; }
            .hero-card { padding: 22px 24px; }
            .hero-val { font-size: 2rem; }
            .kpi-row { grid-template-columns: 1fr; }
            .kpi-card { padding: 14px 16px; }
            .motivos-layout { grid-template-columns: 1fr; }
            .chart-wrap-donut { height: 160px; }
        }

        @keyframes pageIn  { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        @keyframes pageOut { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-6px); } }
        body { animation: pageIn 0.3s ease both; }
        body.leaving { animation: pageOut 0.22s ease forwards; pointer-events:none; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="btn-back" onclick="navTo('dashboard.html')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                Volver
            </button>
            <span class="header-logo">tuo</span>
        </div>
        <span class="page-title">Estadísticas</span>
        <button class="btn-theme" onclick="toggleTheme()" title="Cambiar tema">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </header>

    <main class="main">

        <!-- Saldo actual -->
        <div class="hero-card">
            <div class="hero-label">Saldo actual</div>
            <div class="hero-val" id="valSaldo">—</div>
            <div class="hero-name" id="heroNombre"></div>
        </div>

        <!-- KPIs -->
        <div class="kpi-row">
            <div class="kpi-card">
                <div class="kpi-icon green">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </div>
                <div>
                    <div class="kpi-label">Ingresos</div>
                    <div class="kpi-val green" id="valIngresos">—</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon red">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
                </div>
                <div>
                    <div class="kpi-label">Gastos</div>
                    <div class="kpi-val red" id="valGastos">—</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon blue">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0052FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                </div>
                <div>
                    <div class="kpi-label">Depositado</div>
                    <div class="kpi-val blue" id="valDepositos">—</div>
                </div>
            </div>
        </div>

        <!-- Gráfico combinado -->
        <div class="chart-card">
            <div class="chart-card-header">
                <span class="chart-card-title">Ingresos y gastos por mes</span>
                <div class="chart-legend">
                    <span class="legend-dot" style="background:#0052FF;"></span>
                    <span>Ingresos</span>
                    <span class="legend-sep">·</span>
                    <span class="legend-dot" style="background:#DC2626;"></span>
                    <span>Gastos</span>
                </div>
            </div>
            <div class="chart-wrap">
                <canvas id="chartCombinado"></canvas>
            </div>
        </div>

        <!-- Gastos por motivo (solo si hay datos) -->
        <div class="chart-card" id="motivosCard" style="display:none;">
            <div class="chart-card-header">
                <span class="chart-card-title">Gastos por motivo</span>
            </div>
            <div class="motivos-layout">
                <div class="chart-wrap-donut">
                    <canvas id="chartMotivos"></canvas>
                </div>
                <div class="motivo-list" id="motivoList"></div>
            </div>
        </div>

    </main>

    <script>
        const savedTheme = localStorage.getItem('tuo-theme') || 'light';
        if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        function toggleTheme() {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
            localStorage.setItem('tuo-theme', dark ? 'light' : 'dark');
        }

        const fmt = v => '$ ' + Number(v).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        function last6Months() {
            const result = [];
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const key   = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                const label = d.toLocaleDateString('es-AR', { month: 'short' }).replace('.','');
                result.push({ key, label });
            }
            return result;
        }

        function groupByMonth(txs) {
            const m = {};
            txs.forEach(t => {
                const f = t.createdAt || t.created_at || t.fecha || t.timestamp;
                if (!f) return;
                const d   = new Date(f);
                const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                m[key] = (m[key] || 0) + Number(t.importe || 0);
            });
            return m;
        }

        let chartCombInst = null, chartMotivosInst = null;

        function render(txs, u) {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            const clr  = dark
                ? { grid: '#2C2C2E', tick: '#8E8E8E', barIn: '#3B82F6', barOut: '#F87171' }
                : { grid: '#F0F0F0', tick: '#9E9E9E', barIn: '#0052FF', barOut: '#DC2626' };

            // ── KPIs ──
            const depositos = txs.filter(t => t.cbuOrigen === 'DEPOSITO' && t.cbuDestino === u.cbu);
            const ingresos  = txs.filter(t => t.cbuDestino === u.cbu && t.cbuOrigen !== 'DEPOSITO' && (t.estado === 'aprobada' || t.estado === 'approved'));
            const gastos    = txs.filter(t => t.cbuOrigen  === u.cbu && (t.estado === 'aprobada' || t.estado === 'approved'));

            document.getElementById('valSaldo').textContent    = fmt(u.saldo);
            document.getElementById('heroNombre').textContent  = (u.nombre || '') + ' ' + (u.apellido || '');
            document.getElementById('valIngresos').textContent = fmt(ingresos.reduce((s, t) => s + Number(t.importe), 0));
            document.getElementById('valGastos').textContent   = fmt(gastos.reduce((s, t) => s + Number(t.importe), 0));
            document.getElementById('valDepositos').textContent= fmt(depositos.reduce((s, t) => s + Number(t.importe), 0));

            // ── GRÁFICO COMBINADO ──
            const meses  = last6Months();
            const labels = meses.map(m => m.label);
            const grpIn  = groupByMonth(ingresos);
            const grpOut = groupByMonth(gastos);
            const dataIn  = meses.map(m => grpIn[m.key]  || 0);
            const dataOut = meses.map(m => grpOut[m.key] || 0);

            chartCombInst?.destroy();
            chartCombInst = new Chart(document.getElementById('chartCombinado'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Ingresos',
                            data: dataIn,
                            backgroundColor: dark ? 'rgba(59,130,246,0.25)' : 'rgba(0,82,255,0.12)',
                            borderColor: clr.barIn, borderWidth: 2, borderRadius: 5, borderSkipped: false
                        },
                        {
                            label: 'Gastos',
                            data: dataOut,
                            backgroundColor: dark ? 'rgba(248,113,113,0.2)' : 'rgba(220,38,38,0.1)',
                            borderColor: clr.barOut, borderWidth: 2, borderRadius: 5, borderSkipped: false
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.raw)}`
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: clr.tick, font: { family: 'Inter', size: 11 }, maxRotation: 0 } },
                        y: { grid: { color: clr.grid }, beginAtZero: true, ticks: { color: clr.tick, font: { family: 'Inter', size: 11 }, callback: v => '$ ' + v.toLocaleString('es-AR') } }
                    }
                }
            });

            // ── MOTIVOS ──
            const PIE_COLORS = ['#0052FF','#7C3AED','#059669','#D97706','#DB2777','#0284C7','#DC2626','#10B981'];
            const motivosRaw = JSON.parse(localStorage.getItem('tuo_transferencias_' + u.cbu) || '[]');
            const mTotals = {};
            motivosRaw.forEach(m => { mTotals[m.motivo] = (mTotals[m.motivo] || 0) + Number(m.importe); });
            const entries = Object.entries(mTotals).sort((a, b) => b[1] - a[1]);

            if (entries.length > 0) {
                document.getElementById('motivosCard').style.display = 'block';
                chartMotivosInst?.destroy();
                chartMotivosInst = new Chart(document.getElementById('chartMotivos'), {
                    type: 'doughnut',
                    data: {
                        labels: entries.map(([m]) => m),
                        datasets: [{ data: entries.map(([,v]) => v), backgroundColor: PIE_COLORS.slice(0, entries.length), borderWidth: 0 }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.raw)}` } }
                        },
                        cutout: '68%'
                    }
                });

                document.getElementById('motivoList').innerHTML = entries.slice(0, 5).map(([m, v], i) =>
                    `<div class="motivo-item">
                        <span class="motivo-dot" style="background:${PIE_COLORS[i]};"></span>
                        <span class="motivo-name">${m}</span>
                        <span class="motivo-amt">${fmt(v)}</span>
                    </div>`
                ).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const u = JSON.parse(localStorage.getItem('usuarioLogueado'));
            if (!u) { navTo('login.html'); return; }
            const txs = JSON.parse(localStorage.getItem('tuo_txs_cache') || '[]');
            if (typeof Chart !== 'undefined') {
                render(txs, u);
            } else {
                const wait = setInterval(() => {
                    if (typeof Chart !== 'undefined') { clearInterval(wait); render(txs, u); }
                }, 100);
            }
        });

        function navTo(url) {
            document.body.classList.add('leaving');
            setTimeout(() => { window.location.href = url; }, 230);
        }
        window.addEventListener('pageshow', e => {
            if (e.persisted || performance.getEntriesByType('navigation')[0]?.type === 'back_forward') {
                document.body.classList.remove('leaving');
                document.body.style.animation = 'none';
                void document.body.offsetHeight;
                document.body.style.animation = '';
            }
        });
        document.addEventListener('click', e => {
            const a = e.target.closest('a[href]');
            if (!a) return;
            const href = a.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto')) return;
            e.preventDefault();
            navTo(href);
        });
    </script>
</body>
</html>
